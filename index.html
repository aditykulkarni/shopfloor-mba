<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Shopfloor MBA</title>
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: course player. Sticky top bar, session list on the left, one reading column on the right. */
:root{
  --bg:#F2F6F6; --surface:#FFFFFF; --ink:#12242B; --muted:#56696F; --line:#D5DFE1;
  --accent:#0C6B63; --accent-ink:#FFFFFF; --tint:#E1EFED;
  --gmat:#A34A08; --case:#5A3EA3; --review:#1E5FA8;
  --ok:#177245; --ok-tint:#DDF1E5; --bad:#B3261E; --bad-tint:#FBE4E1;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1618; --surface:#142124; --ink:#E5EDED; --muted:#93A6AB; --line:#27393D;
  --accent:#54C5B6; --accent-ink:#05201D; --tint:#17302E;
  --gmat:#EFA55C; --case:#B8A4F1; --review:#7FB4F0;
  --ok:#62CC90; --ok-tint:#16332A; --bad:#F2877E; --bad-tint:#3A1E1C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1618; --surface:#142124; --ink:#E5EDED; --muted:#93A6AB; --line:#27393D;
  --accent:#54C5B6; --accent-ink:#05201D; --tint:#17302E;
  --gmat:#EFA55C; --case:#B8A4F1; --review:#7FB4F0;
  --ok:#62CC90; --ok-tint:#16332A; --bad:#F2877E; --bad-tint:#3A1E1C; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--accent)}
.bar .meter{flex:1;min-width:0;display:flex;align-items:center;gap:10px;justify-content:flex-end;color:var(--muted);font-size:13px}
.track{width:min(180px,30vw);height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0}
.menu{display:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px}
.menu.sync{display:inline-block;text-decoration:none;font-size:13px;color:var(--muted);white-space:nowrap}
.menu.sync.s-on{color:var(--ok);border-color:var(--ok)}
.menu.sync.s-error{color:var(--bad);border-color:var(--bad)}
.ghs{margin:0 0 14px;font-size:15px;color:var(--muted)}
.ghs.s-on{color:var(--ok)} .ghs.s-error{color:var(--bad)}
.ghf{display:flex;flex-direction:column;gap:6px;max-width:520px}
.ghf label{font-weight:600;font-size:14px;margin-top:8px}
.ghf input.plain{font-family:var(--ui)}
.steps-p{max-width:66ch;margin:0 0 6px;color:var(--muted)}
.ghf input{font:15px/1.4 var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
.ghf .nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.steps{font-family:var(--read);font-size:17px;max-width:66ch;padding-left:22px}
.steps li{margin-bottom:8px}

.shell{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);height:calc(100vh - 49px);overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:8px 0 40px}
.main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:28px 80px}

.mhead{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 16px}
.side .mhead:first-child{border-top:0}
.mhead:hover{background:var(--bg)}
.mhead b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap}
.mhead span{font-family:var(--display);font-weight:700;font-size:15px;min-width:0}
.mhead em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.mhead em::after{content:" +";font-family:var(--mono)}
.mhead[aria-expanded="true"] em::after{content:" −"}
.wk{padding:10px 16px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.it{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;padding:7px 16px;text-decoration:none;color:var(--ink);font-size:14px;border-left:3px solid transparent}
.it:hover{background:var(--bg)}
.it.on{background:var(--tint);border-left-color:var(--accent)}
.it small{display:block;font-size:12px;color:var(--muted)}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);margin-top:3px}
.it.done .dot{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--surface)}
.it.lib .dot{border-radius:3px;border-style:dashed}

.kind{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.k-lesson{color:var(--accent)} .k-gmat{color:var(--gmat)} .k-case{color:var(--case)} .k-review{color:var(--review)}

/* home */
.home{max-width:980px;display:flex;flex-direction:column;gap:36px}
.intro h1{font-size:clamp(28px,4.6vw,44px);font-weight:700;max-width:18ch}
.intro p{max-width:62ch;color:var(--muted);margin:12px 0 0;font-size:16px}
.resume{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.resume h2{font-size:20px;margin-top:4px}
.resume p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.sect h2{font-size:22px;margin-bottom:6px}
.sect>p{color:var(--muted);margin:0 0 14px;max-width:66ch}
.rhythm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rhythm div{background:var(--surface);padding:12px 10px;min-width:0}
.rhythm b{display:block;font-family:var(--mono);font-weight:500;font-size:12px;color:var(--muted)}
.rhythm span{font-size:13px;display:block;margin-top:4px}
.road{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rm{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.rm .no{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:3px}
.rm h3{font-size:18px}
.rm .sub{font-size:13px;color:var(--accent);margin-top:2px}
.rm p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:64ch}
.rm .g b{color:var(--gmat);font-weight:600}
.rm .links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:14px}
.pill{font-size:12px;border-radius:99px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-family:var(--mono)}
.pill.open{background:var(--tint);border-color:transparent;color:var(--accent)}
.scores{display:flex;flex-wrap:wrap;gap:10px}
.scores div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted)}
.scores b{display:block;font-family:var(--mono);font-size:17px;font-weight:500;color:var(--ink)}
.sync{font-size:13px;color:var(--muted)}

/* library */
.libr{max-width:820px;display:flex;flex-direction:column;gap:30px}
.libr header h1{font-size:clamp(26px,4vw,36px);margin-top:8px}
.libr header p{color:var(--muted);max-width:64ch;margin:10px 0 0}
.libr h2{font-size:20px;margin-bottom:4px}
.entries{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.entry{padding:14px 0;border-bottom:1px solid var(--line)}
.entry h3{font-size:17px}
.entry h3 a{text-decoration-thickness:1px;text-underline-offset:3px}
.entry .by{font-size:13px;color:var(--muted);margin-top:2px}
.entry p{margin:8px 0 0;font-size:15px;max-width:68ch}
.entry .sec{font-family:var(--read);font-size:16px}
.entry .lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}

/* session */
.sess{max-width:720px}
.sess header{margin-bottom:18px}
.sess header h1{font-size:clamp(26px,4vw,36px);font-weight:700;margin-top:8px}
.sess header .meta{color:var(--muted);font-size:13px;margin-top:8px}
.res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;border-block:1px solid var(--line);padding:14px 0;margin-bottom:24px;font-size:14px}
.res dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.res dd{margin:0;min-width:0}
.res dd a{display:block}
.body{font-family:var(--read);font-size:18px;line-height:1.62}
.body p,.body ul,.body ol{margin:0 0 16px}
.body li{margin-bottom:6px}
.body h3{font-size:21px;margin:30px 0 10px}
.body h4{font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--ui);color:var(--accent);margin-bottom:6px}
.lede{font-size:20px;color:var(--muted)}
.note{font-size:15px;color:var(--muted);font-family:var(--ui)}
.formula{font-family:var(--mono);font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;overflow-x:auto}
.callout{background:var(--tint);border-radius:10px;padding:16px 18px;margin:26px 0}
.callout p{margin:0;font-size:17px}
.tw{overflow-x:auto;margin:0 0 20px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.stmt{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:14px}
.stmt th,.stmt td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.stmt thead th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stmt .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stmt tr.sub td{font-weight:600;border-top:1px solid var(--ink)}
.stmt tr.total td{font-weight:700;border-top:1px solid var(--ink);border-bottom:3px double var(--ink)}
.stmt tr.head td{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.stmt tbody tr:last-child td{border-bottom-width:0}
.stmt tbody tr.total:last-child td{border-bottom:3px double var(--ink)}
.passage{margin:0 0 20px;padding:4px 0 4px 18px;border-left:2px solid var(--gmat);font-size:17px}
details.model{border:1px solid var(--case);border-radius:10px;margin-top:24px;background:var(--surface)}
details.model summary{cursor:pointer;padding:12px 16px;font-family:var(--ui);font-weight:600;font-size:15px;color:var(--case)}
details.model>*:not(summary){margin-inline:16px}
.assign{border-top:1px solid var(--line);margin-top:30px;padding-top:6px}

.quiz{display:flex;flex-direction:column;gap:18px;margin:26px 0;font-family:var(--ui)}
.qhead{font-family:var(--display);font-weight:700;font-size:19px}
.qq{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;margin:0;min-width:0}
.qq .qp{font-size:16px;font-weight:600;margin:0 0 12px}
.qq .qn{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;display:block;margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.opt.right{background:var(--ok-tint);border-color:var(--ok)}
.opt.wrong{background:var(--bad-tint);border-color:var(--bad)}
.opt .tag{float:right;font-size:12px;font-weight:600;margin-left:8px}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.why{margin:12px 0 0;font-size:14.5px;color:var(--muted)}
.result{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-radius:10px;background:var(--tint);padding:12px 16px;font-size:15px}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:14px}
.notes{margin-top:26px;font-family:var(--ui)}
.notes label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.notes textarea{width:100%;min-height:150px;font:15px/1.5 var(--ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
.notes small{color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.foot .nav{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;align-items:center}
.empty{color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu{display:block}
  .side{position:fixed;inset:0;top:calc(env(safe-area-inset-top,0px) + 49px);height:auto;z-index:15;border-right:0}
  .side:not(.show){display:none}
  .rhythm{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rm{grid-template-columns:minmax(0,1fr) auto}
  .rm .no{grid-column:1/-1;padding:0}
  .bar .meter span{display:none}
  .track{width:60px}
  .body{font-size:17px}
  .res{grid-template-columns:minmax(0,1fr);gap:2px}
  .res dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:no-preference){ .track i{transition:width .3s} }
</style>
</head>
<body>

<div class="bar">
  <button class="menu" id="menuBtn" aria-controls="side" aria-expanded="false">Sessions</button>
  <a class="brand" href="#home">Shopfloor <span>MBA</span></a>
  <a class="menu sync" id="syncBtn" href="#signin" hidden>Sign in</a>
  <div class="meter"><span id="meterText">Loading</span><div class="track" aria-hidden="true"><i id="meterBar"></i></div></div>
</div>
<div class="shell">
  <nav class="side" id="side" aria-label="Course sessions"></nav>
  <main class="main" id="main"><p class="empty">Loading the course.</p></main>
</div>

<script>
(function(){
var KIND={lesson:'Lesson',gmat:'GMAT',case:'Case study',review:'Review'};
var months=[],items=[],byId={},gmatRes=null,openM={},autoOpen=null;
var state={done:{},quiz:{},notes:{},qt:{},nt:{}};
var saveDelay=900,ready=false;
var LS='shopfloor-mba-v1';
var remote=null, syncNote='Progress is saved in this browser.';
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function yt(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q)}

/* ---------- storage ---------- */
function loadLocal(){try{var r=JSON.parse(localStorage.getItem(LS)||'null');if(r){state.done=r.done||{};state.quiz=r.quiz||{};state.notes=r.notes||{};state.qt=r.qt||{};state.nt=r.nt||{}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function makeSaver(getBody,key){
  var timer=null,busy=false,dirty=false;
  function run(){
    if(!remote){return}
    if(busy){dirty=true;return}
    busy=true;dirty=false;
    remote[key].set(JSON.parse(JSON.stringify(getBody()))).catch(function(){
      syncNote='Could not save to your account just now. Progress is kept in this browser.';
    }).then(function(){busy=false;if(dirty)run()});
  }
  return function(){saveLocal();if(!remote)return;clearTimeout(timer);timer=setTimeout(run,saveDelay)};
}
var saveProgress=makeSaver(function(){return {done:state.done,quiz:state.quiz,qt:state.qt}},'p');
var saveNotes=makeSaver(function(){return {notes:state.notes,nt:state.nt}},'n');

function merge(p,n){
  var rd=p.done||{},rq=p.quiz||{},rqt=p.qt||{},rn=n.notes||{},rnt=n.nt||{},k,push=false,pushN=false;
  for(k in state.done){if(!rd[k])push=true}
  for(k in rd){state.done[k]=rd[k]}
  for(k in rq){if(!state.quiz[k]||(rqt[k]||0)>=(state.qt[k]||0)){state.quiz[k]=rq[k];state.qt[k]=rqt[k]||0}}
  for(k in state.quiz){if(!rq[k]||(state.qt[k]||0)>(rqt[k]||0))push=true}
  for(k in rn){if(state.notes[k]==null||(rnt[k]||0)>=(state.nt[k]||0)){state.notes[k]=rn[k];state.nt[k]=rnt[k]||0}}
  for(k in state.notes){if(state.notes[k]&&(rn[k]==null||(state.nt[k]||0)>(rnt[k]||0)))pushN=true}
  return {p:push,n:pushN};
}

/* ---------- Sign-in and GitHub storage (used when the page is hosted outside Claude) ---------- */
var HOSTED=!window.claude||!window.claude.use;
var GH_LS='shopfloor-mba-gh',SKIP_LS='shopfloor-mba-skip',LS0=LS,gh=null,ghSha=null,ghBusy=null,ghDirty=false,ghState='off',ghMsg='';
function ghCfg(){try{return JSON.parse(localStorage.getItem(GH_LS)||'null')}catch(e){return null}}
function skipped(){try{return localStorage.getItem(SKIP_LS)==='1'}catch(e){return false}}
function slugOf(n){return String(n||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function emptyState(){return {done:{},quiz:{},notes:{},qt:{},nt:{}}}
function hasData(s){return Object.keys(s.done).length||Object.keys(s.quiz).length||Object.keys(s.notes).length}
function b64e(s){var b=new TextEncoder().encode(s),o='';for(var i=0;i<b.length;i++)o+=String.fromCharCode(b[i]);return btoa(o)}
function b64d(s){var r=atob(s.replace(/\s/g,'')),b=new Uint8Array(r.length);for(var i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return new TextDecoder().decode(b)}
function ghFetch(path,method,body){
  return fetch('https://api.github.com/repos/'+gh.repo+path,{method:method||'GET',cache:'no-store',
    headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+gh.token,'X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined});
}
function ghFile(){return '/contents/users/'+gh.slug+'.json'}
function ghRead(path,keepSha){
  return ghFetch(path+'?t='+Date.now()).then(function(r){
    if(r.status===404)return null;
    if(!r.ok)throw new Error('GitHub answered '+r.status);
    return r.json().then(function(j){if(Array.isArray(j))return j;if(keepSha)ghSha=j.sha;try{return JSON.parse(b64d(j.content))}catch(e){return {}}});
  });
}
function ghPull(){
  ghSha=null;
  return ghRead(ghFile(),true).then(function(d){
    if(d)return d;
    /* first person to sign in: bring over progress saved before sign-in existed */
    return ghRead('/contents/users').then(function(list){
      if(list&&list.length)return {};
      return ghRead('/contents/progress.json').then(function(old){return old||{}});
    });
  });
}
function ghPush(retry){
  var data={name:gh.name,done:state.done,quiz:state.quiz,qt:state.qt,notes:state.notes,nt:state.nt,updated:new Date().toISOString()};
  var body={message:'Update progress for '+gh.slug,content:b64e(JSON.stringify(data,null,1))};
  if(ghSha)body.sha=ghSha;
  return ghFetch(ghFile(),'PUT',body).then(function(r){
    if(r.ok)return r.json().then(function(j){ghSha=j.content.sha;ghState='on';ghMsg='Signed in as '+gh.name+'. Last saved at '+new Date().toLocaleTimeString()+'.';});
    if((r.status===409||r.status===422)&&!retry){return ghRead(ghFile(),true).then(function(d){d=d||{};merge(d,d);saveLocal();return ghPush(true)})}
    throw new Error('GitHub answered '+r.status);
  });
}
function ghSave(){
  if(!gh)return Promise.resolve();
  if(ghBusy){ghDirty=true;return ghBusy}
  ghBusy=ghPush().catch(function(e){ghState='error';ghMsg='Could not save to GitHub ('+e.message+'). Progress is kept in this browser and will be sent next time.'})
    .then(function(){ghBusy=null;paintSync();if(ghDirty){ghDirty=false;return ghSave()}});
  return ghBusy;
}
function useProfile(slug){
  var anon=null;
  try{anon=JSON.parse(localStorage.getItem(LS0)||'null')}catch(e){}
  LS=slug?'shopfloor-mba-u-'+slug:LS0;
  state=emptyState();loadLocal();
  if(slug&&!hasData(state)&&anon&&hasData(Object.assign(emptyState(),anon))){
    state=Object.assign(emptyState(),anon);saveLocal();
    try{localStorage.removeItem(LS0)}catch(e){}
  }
}
function ghConnect(cfg){
  cfg.slug=slugOf(cfg.name);
  gh=cfg;ghState='checking';ghMsg='Signing in.';paintSync();
  return ghFetch('').then(function(r){
    if(r.status===401)throw new Error('The token was rejected. Check that it was copied in full and has not expired.');
    if(r.status===404||r.status===403)throw new Error('The token cannot see the repository "'+cfg.repo+'". Check the name and that the token was given access to it.');
    if(!r.ok)throw new Error('GitHub answered '+r.status+'.');
    useProfile(cfg.slug);
    return ghPull();
  }).then(function(d){
    var need=merge(d,d);
    remote={p:{set:ghSave},n:{set:ghSave}};saveDelay=4000;
    ghState='on';ghMsg='Signed in as '+cfg.name+'.';
    syncNote='Signed in as '+cfg.name+'. Progress is saved to the private GitHub repository a few seconds after each change.';
    try{localStorage.setItem(GH_LS,JSON.stringify(cfg))}catch(e){}
    saveLocal();
    if(need.p||need.n||!ghSha)ghSave();
    if(/^(sync|signin)$/.test((location.hash||'').slice(1)))location.hash='home';else route(true);
  }).catch(function(e){
    gh=null;remote=null;ghState='error';ghMsg=e.message||'Could not reach GitHub.';
    if($('#gh-status'))paintSync();else route(true);
  });
}
function signOut(){
  gh=null;remote=null;ghSha=null;saveDelay=900;ghState='off';ghMsg='';syncNote='Progress is saved in this browser.';

function getJSON(path){
  var C=window.__COURSE__;
  if(C)return Promise.resolve(C.syllabus);
  return fetch(path).then(function(r){return r.json()});
}
function getText(path){
  var C=window.__COURSE__;
  if(C)return Promise.resolve(C.files[path]||'');

}
function load(){
  return getJSON('content/syllabus.json').then(function(s){
    months=s.months;gmatRes=s.gmat||null;
    var jobs=[];
    months.forEach(function(m){
      m.items=[];
      if(!m.files)return;
      m.weeks=[];
      m.files.forEach(function(f,i){
        jobs.push(getText(f).then(function(t){return {m:m,i:i,doc:new DOMParser().parseFromString(t,'text/html')}}));
      });
    });
    return Promise.all(jobs);
  }).then(function(parts){
    parts.sort(function(a,b){return a.m.n-b.m.n||a.i-b.i});
    parts.forEach(function(p){
      p.doc.querySelectorAll('section[data-week]').forEach(function(sec){
        var w={n:+sec.dataset.week,title:sec.dataset.title,goal:sec.dataset.goal,items:[]};
        sec.querySelectorAll('article[data-id]').forEach(function(a){

          w.items.push(it);p.m.items.push(it);items.push(it);byId[it.id]=it;
        });

    });
  });
}

/* ---------- session ---------- */
function buildQuiz(src,it,qi0,graded){
  var qs=[].slice.call(src.querySelectorAll('.q'));
  var saved=(state.quiz[it.id]&&state.quiz[it.id].ans)||{};
  var box=document.createElement('div');box.className='quiz';
  var head=document.createElement('div');head.className='qhead';head.textContent=graded?'Graded quiz':(it.type==='gmat'?'Practice questions':'Check yourself');box.appendChild(head);
  var res=document.createElement('div');res.className='result';res.hidden=true;
  function finish(){
    var all=qs.every(function(_,i){return saved[qi0+i]});
    if(!all){res.hidden=true;return}
    var score=qs.filter(function(q,i){return saved[qi0+i]===q.dataset.a}).length;
    res.hidden=false;res.innerHTML='<span><b>'+score+' of '+qs.length+' correct.</b> '+(score===qs.length?'Clean sheet.':score>=qs.length*0.7?'Solid. Reread the explanations for the ones you missed.':'Go back over the sessions these came from, then try again.')+'</span>';
    var b=document.createElement('button');b.className='linkbtn';b.textContent='Clear answers and retry';
    b.onclick=function(){qs.forEach(function(_,i){delete saved[qi0+i]});state.qt[it.id]=Date.now();var q=state.quiz[it.id];if(q){q.ans=saved;if(graded){delete q.score;delete q.total}}saveProgress();session(it)};
    res.appendChild(b);
    if(graded){var q=state.quiz[it.id]=state.quiz[it.id]||{};q.ans=saved;if(q.score!==score||q.total!==qs.length){q.score=score;q.total=qs.length;state.qt[it.id]=Date.now();saveProgress()}}
  }
  qs.forEach(function(q,i){
    var fs=document.createElement('div');fs.className='qq';
    var p=document.createElement('p');p.className='qp';p.innerHTML='<span class="qn">Question '+(i+1)+' of '+qs.length+'</span>'+q.querySelector('p').innerHTML;fs.appendChild(p);
    var opts=document.createElement('div');opts.className='opts';
    var why=document.createElement('p');why.className='why';why.hidden=true;why.innerHTML=q.querySelector('.why').innerHTML;
    var btns=[];
    function show(){
      var pick=saved[qi0+i];if(!pick)return;
      btns.forEach(function(b){
        b.disabled=true;
        if(b.dataset.o===q.dataset.a){b.classList.add('right');b.insertAdjacentHTML('beforeend','<span class="tag">Correct</span>')}
        else if(b.dataset.o===pick){b.classList.add('wrong');b.insertAdjacentHTML('beforeend','<span class="tag">Your answer</span>')}
      });
      why.hidden=false;
    }
    q.querySelectorAll('li').forEach(function(li){
      var b=document.createElement('button');b.type='button';b.className='opt';b.dataset.o=li.dataset.o;b.innerHTML=li.innerHTML;
      b.onclick=function(){
        if(saved[qi0+i])return;
        saved[qi0+i]=li.dataset.o;
        var st=state.quiz[it.id]=state.quiz[it.id]||{};st.ans=saved;state.qt[it.id]=Date.now();
        show();finish();saveProgress();
      };
      btns.push(b);opts.appendChild(b);
    });
    fs.appendChild(opts);fs.appendChild(why);box.appendChild(fs);show();
  });
  box.appendChild(res);finish();
  return {el:box,count:qs.length};
}
function session(it){
  var idx=items.indexOf(it),prev=items[idx-1],next=items[idx+1];
  var main=$('#main');main.innerHTML='';
  var wrap=document.createElement('article');wrap.className='sess';
  var h='<header><span class="kind k-'+it.type+'">'+KIND[it.type]+' · Month '+it.month.n+', week '+it.week.n+', day '+(it.week.items.indexOf(it)+1)+'</span><h1>'+esc(it.title)+'</h1><div class="meta">About '+it.mins+' minutes · Week goal: '+esc(it.week.goal||'')+'</div></header>';
  if(it.watch||it.read){
    h+='<dl class="res">';
    if(it.watch){h+='<dt>Watch</dt><dd>'+it.watch.split(';').map(function(q){q=q.trim();return q?'<a href="'+yt(q)+'" target="_blank" rel="noopener">Search YouTube for "'+esc(q)+'"</a>':''}).join('')+'</dd>'}
    if(it.read){h+='<dt>Read</dt><dd>'+esc(it.read)+'</dd>'}
    h+='<dt>More</dt><dd><a href="#res-m'+it.month.n+'">This month\'s video courses and books</a></dd></dl>';
  }
  wrap.innerHTML=h;
  var body=document.createElement('div');body.className='body';body.innerHTML=it.el.innerHTML;
  body.querySelectorAll('table').forEach(function(t){var w=document.createElement('div');w.className='tw';t.parentNode.insertBefore(w,t);w.appendChild(t)});
  var off=0;
  body.querySelectorAll('.quiz').forEach(function(q){var r=buildQuiz(q,it,off,q.classList.contains('graded'));off+=r.count;q.parentNode.replaceChild(r.el,q)});
  wrap.appendChild(body);
  if(it.type==='case'||it.type==='review'){
    var n=document.createElement('div');n.className='notes';
    n.innerHTML='<label for="notes-'+it.id+'">Your notes</label><textarea id="notes-'+it.id+'" placeholder="'+(it.type==='case'?'Write your answers here before opening the model answer.':'Write up the work assignment here.')+'"></textarea><small>'+esc(syncNote)+'</small>';
    var ta=n.querySelector('textarea');ta.value=state.notes[it.id]||'';
    ta.addEventListener('input',function(){state.notes[it.id]=ta.value;state.nt[it.id]=Date.now();saveNotes()});
    var m=body.querySelector('details.model');
    if(m)body.insertBefore(n,m);else wrap.appendChild(n);
  }
  var foot=document.createElement('div');foot.className='foot';
  foot.innerHTML='<div class="nav">'+(prev?'<a href="#'+prev.id+'">Previous</a>':'')+'<a href="#home">Course home</a></div>';
  var acts=document.createElement('div');acts.className='nav';
  var done=!!state.done[it.id];
  var b=document.createElement('button');b.className='btn'+(done?' ghost':'');b.textContent=done?'Completed. Mark as not done':'Mark complete';
  b.onclick=function(){
    if(state.done[it.id]){delete state.done[it.id]}else{state.done[it.id]=1}
    saveProgress();
    if(state.done[it.id]&&next){location.hash=next.id}else{route(true)}
  };
  acts.appendChild(b);
  if(next&&done){var a=document.createElement('a');a.className='btn';a.href='#'+next.id;a.textContent='Next session';acts.appendChild(a)}
  foot.appendChild(acts);wrap.appendChild(foot);
  main.appendChild(wrap);
}

function route(keep){
  var id=(location.hash||'').slice(1),it=byId[id],lm=/^res-m(\d+)$/.exec(id),lib=null;
  if(lm){lib=months.filter(function(m){return m.n===+lm[1]})[0]||null}
  var ae=document.activeElement;
  if(keep&&it&&ae&&ae.tagName==='TEXTAREA'){meter();return}
  var cm=it?it.month.n:lib?lib.n:((nextUp()||items[0]||{month:{n:1}}).month.n);
  if(autoOpen!==cm){openM[cm]=true;autoOpen=cm}
  var wantSign=HOSTED&&(id==='sync'||id==='signin'||(ready&&!gh&&ghState!=='checking'&&!skipped()));
  if(keep&&wantSign&&$('#gh-form')&&ae&&ae.tagName==='INPUT'){meter();paintSync();return}
  if(wantSign)signPage();else if(it)session(it);else if(lib)library(lib);else home();
  sidebar(wantSign?null:it?it.id:lib?id:null,cm);meter();paintSync();
  $('#side').classList.remove('show');$('#menuBtn').setAttribute('aria-expanded','false');
  if(!keep)window.scrollTo(0,0);
}
$('#menuBtn').onclick=function(){var s=$('#side').classList.toggle('show');this.setAttribute('aria-expanded',s?'true':'false')};
window.addEventListener('hashchange',function(){route(false)});

loadLocal();
load().then(function(){var c=HOSTED?ghCfg():null;if(c&&c.name&&c.repo&&c.token){ghState='checking'}ready=true;route(false);connect()}).catch(function(){
  $('#main').innerHTML='<p class="empty">The course content did not load. Reload the page. </p>';
});
})();
</script>
